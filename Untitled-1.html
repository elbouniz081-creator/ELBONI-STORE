<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELBONI STORE</title>

<link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/107/107831.png">

<style>
/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#fff;
    color:#111;
    overflow-x:hidden;
}

/* HEADER */
header{
    background:black;
    color:white;
    padding:20px;
    text-align:center;
    font-size:30px;
    font-weight:bold;
    letter-spacing:3px;
}

/* WAVY WELCOME SECTION */
.wave-section{
    position:relative;
    height:300px;
    background:black;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.wave-section h1{
    font-size:50px;
    color:white;
    letter-spacing:4px;
    animation:fadeIn 2s ease forwards;
}

/* WAVES */
.wave{
    position:absolute;
    bottom:0;
    left:0;
    width:200%;
    height:100px;
    background:white;
    border-radius:100%;
    animation:waveMove 6s linear infinite;
}
.wave:nth-child(2){
    bottom:20px;
    opacity:0.5;
    animation-duration:8s;
}

@keyframes waveMove{
    0%{transform:translateX(0);}
    100%{transform:translateX(-50%);}
}
@keyframes fadeIn{
    from{opacity:0; transform:translateY(-20px);}
    to{opacity:1; transform:translateY(0);}
}

/* PRODUCTS */
.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:30px;
    padding:50px;
}

/* PRODUCT CARD */
.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
    transition:0.3s;
    text-align:center;
}
.card:hover{
    transform:translateY(-10px);
}
.card img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:12px;
    transition: transform 0.4s ease, box-shadow 0.4s ease;
}
.card:hover img{
    transform: scale(1.1) rotate(2deg);
    box-shadow: 0 15px 25px rgba(0,0,0,0.3);
}
.card img.added {
    animation: popBounce 0.5s forwards;
}
@keyframes popBounce {
    0% { transform: scale(1) rotate(0deg); }
    30% { transform: scale(1.3) rotate(5deg); }
    50% { transform: scale(1.1) rotate(-3deg); }
    70% { transform: scale(1.2) rotate(3deg); }
    100% { transform: scale(1) rotate(0deg); }
}
.card h3{
    margin:15px 0 5px;
}
.price{
    font-weight:bold;
    margin-bottom:10px;
}

/* BUTTON */
button{
    background:black;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:25px;
    cursor:pointer;
    transition:0.3s;
    margin-bottom:15px;
}
button:hover{
    background:#333;
}
button.added{
    background:green;
}

/* CART */
#cart{
    position:fixed;
    right:-350px;
    top:0;
    width:350px;
    height:100%;
    background:white;
    box-shadow:-5px 0 20px rgba(0,0,0,0.3);
    padding:20px;
    transition:0.4s;
    overflow-y:auto;
    z-index:999;
}
#cart.active{
    right:0;
}
#cart h2{
    margin-bottom:15px;
}
#cart p{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
}
#cart button{
    width:100%;
}

/* LOAD MORE BUTTON */
#loadMore{
    display:block;
    margin:40px auto;
    padding:15px 30px;
    font-size:18px;
    border:none;
    border-radius:25px;
    background:black;
    color:white;
    cursor:pointer;
    transition:0.3s;
}
#loadMore:hover{
    background:#333;
}

/* FOOTER */
footer{
    background:black;
    color:white;
    text-align:center;
    padding:20px;
}
</style>
</head>

<body>

<header>
ELBONI STORE
</header>

<section class="wave-section">
    <h1>WELCOME TO ELBONI</h1>
    <div class="wave"></div>
    <div class="wave"></div>
</section>

<section class="container" id="products"></section>

<button id="loadMore">Load More Products</button>

<div id="cart">
    <h2>Your Cart</h2>
    <div id="cart-items"></div>
    <h3>Total: $<span id="total">0</span></h3>
    <button onclick="toggleCart()">Close Cart</button>
</div>

<footer>
© 2026 ELBONI STORE - Black & White Edition
</footer>

<script>
// PRODUCTS LIST
let products=[
{ name:"Nike Air Shirt", price:35, img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab" },
{ name:"Adidas Hoodie", price:55, img:"https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf" },
{ name:"Nike Sneakers", price:95, img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff" },
{ name:"Adidas Sneakers", price:90, img:"https://images.unsplash.com/photo-1600185365483-26d7a4cc7519" }
];

// DUPLICATE PRODUCTS FOR SCROLL
let allProducts = [];
for(let i=0;i<5;i++){ products.forEach(p=>allProducts.push(p)); }

let cart=[];
let container = document.getElementById("products");
let loadCount = 0;
let loadAmount = 6; // products per load

function loadProducts(){
    let start = loadCount*loadAmount;
    let end = start + loadAmount;
    let toLoad = allProducts.slice(start,end);

    toLoad.forEach((product,index)=>{
        container.innerHTML+=`
        <div class="card">
            <img src="${product.img}">
            <h3>${product.name}</h3>
            <p class="price">$${product.price}</p>
            <button onclick="addToCart(${start+index}, this)">Add to Cart</button>
        </div>
        `;
    });

    loadCount++;
    if(loadCount*loadAmount >= allProducts.length){
        document.getElementById("loadMore").style.display="none";
    }
}

// INITIAL LOAD
loadProducts();

// LOAD MORE BUTTON
document.getElementById("loadMore").addEventListener("click",()=>{
    loadProducts();
});

// ADD TO CART FUNCTION
function addToCart(index, btn){
    cart.push(allProducts[index]);
    updateCart();

    // BUTTON animation
    btn.classList.add("added");
    btn.innerText="✔ Added";

    // IMAGE animation
    const img = btn.parentElement.querySelector("img");
    img.classList.add("added");
    setTimeout(()=>{ img.classList.remove("added"); }, 500);

    // Reset button
    setTimeout(()=>{
        btn.classList.remove("added");
        btn.innerText="Add to Cart";
    },800);

    // Open cart automatically
    document.getElementById("cart").classList.add("active");
}

// UPDATE CART
function updateCart(){
    let cartItems=document.getElementById("cart-items");
    cartItems.innerHTML="";
    let total=0;

    cart.forEach((item,i)=>{
        total+=item.price;
        cartItems.innerHTML+=`
        <p>${item.name} - $${item.price} <button onclick="removeItem(${i})">X</button></p>
        `;
    });

    document.getElementById("total").innerText=total;
}

// REMOVE ITEM FROM CART
function removeItem(i){
    cart.splice(i,1);
    updateCart();
}

// TOGGLE CART
function toggleCart(){
    document.getElementById("cart").classList.toggle("active");
}
</script>

</body>
</html>
